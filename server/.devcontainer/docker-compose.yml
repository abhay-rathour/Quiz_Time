version: '3'
services:
  node:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "4000:4000"
      - "9229:9229" # Debugging
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/devdb
      - JWT_SECRET_KEY=12345-67890-09876-54321
      - PORT=4000
    volumes:
      - C:/Dev/Quiz_Time/server/:/workspace
      - /workspace/node_modules

  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: